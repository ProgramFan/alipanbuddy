<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- AlipanBuddy · 神行云盘助手 — a swift, friendly cloud (transparent background) -->
  <defs>
    <linearGradient id="cloud" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5B8CFF"/>
      <stop offset="0.55" stop-color="#6A5CFF"/>
      <stop offset="1" stop-color="#8A44F0"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.3" cy="0.2" r="0.8">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="16"/>
      <feOffset dy="18" result="b"/>
      <feFlood flood-color="#2A2C7A" flood-opacity="0.30"/>
      <feComposite in2="b" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- scaled up: no background plate, so the mark fills the canvas -->
  <g transform="translate(512 512) scale(1.18) translate(-527 -556)">
    <!-- speed streaks (神行) -->
    <g stroke="#6A6CFF" stroke-width="44" stroke-linecap="round" fill="none">
      <line x1="150" y1="500" x2="286" y2="500" opacity="0.95"/>
      <line x1="196" y1="588" x2="266" y2="588" opacity="0.70"/>
      <line x1="152" y1="676" x2="306" y2="676" opacity="0.45"/>
    </g>

    <!-- cloud body -->
    <g filter="url(#shadow)">
      <path fill="url(#cloud)" d="
        M 332 748
        H 760
        A 144 144 0 0 0 792 464
        A 200 200 0 0 0 420 402
        A 130 130 0 0 0 332 748
        Z"/>
      <path fill="url(#sheen)" d="
        M 332 748
        H 760
        A 144 144 0 0 0 792 464
        A 200 200 0 0 0 420 402
        A 130 130 0 0 0 332 748
        Z"/>
    </g>

    <!-- buddy face -->
    <g fill="#FFFFFF">
      <circle cx="512" cy="586" r="24"/>
      <circle cx="644" cy="586" r="24"/>
    </g>
    <path d="M 520 656 Q 578 712 636 656" stroke="#FFFFFF" stroke-width="26" stroke-linecap="round" fill="none"/>
    <g fill="#FFB3C1" opacity="0.85">
      <circle cx="452" cy="646" r="20"/>
      <circle cx="704" cy="646" r="20"/>
    </g>
  </g>
</svg>
