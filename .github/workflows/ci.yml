name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  renderer:
    name: Renderer (typecheck, tests, unused code)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm has to exist before setup-node so that `cache: pnpm` can find the store.
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # src/secrets.generated.ts is gitignored; the renderer imports it, so generate the (empty) module first.
      - name: Generate secrets module
        run: node scripts/generate-secrets.mjs --mode=ci

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm run test

      - name: Unused files, exports and dependencies
        run: pnpm run knip

  rust:
    name: Rust (check, core tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --fix-missing libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      # tauri-build validates the aria2c sidecar (externalBin) and the frontendDist directory at compile time.
      - name: Prepare sidecar and frontend dist placeholder
        run: |
          node scripts/prepare-sidecars.mjs
          mkdir -p dist

      - name: Cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml --all-targets

      - name: Core tests
        run: cargo test --manifest-path src-tauri/Cargo.toml -p alipancore
