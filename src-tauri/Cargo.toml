[package]
name = "alipanbuddy"
version = "1.4.0"
description = "AlipanBuddy (神行云盘助手) - Aliyun Drive desktop client"
authors = ["programfan"]
repository = "https://github.com/programfan/alipanbuddy"
license = "GPL-3.0"
edition = "2021"
rust-version = "1.77"

[workspace]
members = ["crates/alipancore"]

[lib]
name = "alipanbuddy_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
alipancore = { path = "crates/alipancore" }
tauri = { version = "2", features = ["tray-icon", "devtools", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "sync"] }
reqwest = { version = "0.12", features = ["stream", "json", "socks", "gzip"] }
log = "0.4"
env_logger = "0.11"
parking_lot = "0.12"
base64 = "0.22"
url = "2"
keepawake = "0.5"
local-ip-address = "0.6"
futures-util = "0.3"

[features]
default = []

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
