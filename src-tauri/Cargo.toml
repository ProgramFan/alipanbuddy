[package]
name = "alipanbuddy"
version = "0.0.0"
description = "AlipanBuddy (神行云盘助手) - Aliyun Drive desktop client"
authors = ["programfan"]
repository = "https://github.com/programfan/alipanbuddy"
license = "GPL-3.0"
edition = "2021"
rust-version = "1.77"

[workspace]
members = ["crates/boxcore"]

[lib]
name = "alipanbuddy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
boxcore = { path = "crates/boxcore" }
tauri = { version = "2", features = ["tray-icon", "devtools", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-os = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["stream", "json", "socks", "gzip", "brotli", "deflate"] }
log = "0.4"
env_logger = "0.11"
parking_lot = "0.12"
base64 = "0.22"
url = "2"
dirs = "6"
keepawake = "0.5"
local-ip-address = "0.6"
futures-util = "0.3"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }

[features]
default = []

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
