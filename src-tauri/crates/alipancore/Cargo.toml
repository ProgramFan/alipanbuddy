[package]
name = "alipancore"
version = "1.0.0"
edition = "2021"
license = "GPL-3.0"
description = "Platform-independent core of AlipanBuddy (encryption, proxy, upload, hashing, aria2 launcher)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["stream", "json", "socks"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query"] }
bytes = "1"
futures-util = "0.3"
http-body-util = "0.1"
aes = "0.8"
ctr = "0.9"
cipher = "0.4"
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
hmac = "0.12"
hex = "0.4"
base64 = "0.22"
percent-encoding = "2"
url = "2"
thiserror = "2"
log = "0.4"
parking_lot = "0.12"
once_cell = "1"

[dev-dependencies]
tempfile = "3"
