<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- AlipanBuddy · 神行云盘助手 — a swift, friendly cloud -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5B8CFF"/>
      <stop offset="0.55" stop-color="#6A5CFF"/>
      <stop offset="1" stop-color="#8A44F0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.28" cy="0.18" r="0.75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cloud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E9EEFF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="22"/>
      <feOffset dy="26" result="b"/>
      <feFlood flood-color="#1E1F66" flood-opacity="0.35"/>
      <feComposite in2="b" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- squircle background -->
  <rect width="1024" height="1024" rx="230" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="230" fill="url(#glow)"/>

  <!-- speed streaks (神行) -->
  <g stroke="#FFFFFF" stroke-width="40" stroke-linecap="round" fill="none">
    <line x1="118" y1="500" x2="272" y2="500" opacity="0.95"/>
    <line x1="160" y1="588" x2="250" y2="588" opacity="0.70"/>
    <line x1="120" y1="676" x2="292" y2="676" opacity="0.45"/>
  </g>

  <!-- cloud body -->
  <g filter="url(#shadow)">
    <path fill="url(#cloud)" d="
      M 332 748
      H 760
      A 144 144 0 0 0 792 464
      A 200 200 0 0 0 420 402
      A 130 130 0 0 0 332 748
      Z"/>
  </g>

  <!-- buddy face -->
  <g fill="#3A3FB8">
    <circle cx="512" cy="586" r="24"/>
    <circle cx="644" cy="586" r="24"/>
  </g>
  <path d="M 520 656 Q 578 712 636 656" stroke="#3A3FB8" stroke-width="26" stroke-linecap="round" fill="none"/>
  <g fill="#FF8FA3" opacity="0.75">
    <circle cx="452" cy="646" r="20"/>
    <circle cx="704" cy="646" r="20"/>
  </g>
</svg>
